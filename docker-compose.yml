services:
  ia-engine:
    build:
      context: ./ia-engine
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - PORT=8000
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=8080
      - GOOGLE_APPLICATION_CREDENTIALS=/app/.secrets/service-account.json
      - IA_ENGINE_ENABLED=${IA_ENGINE_ENABLED:-1}
      - IA_ENGINE_BASE_URL=http://ia-engine:8000
    volumes:
      - ./backend/.secrets:/app/.secrets:ro
    ports:
      - "8080:8080"
    depends_on:
      - ia-engine
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: http://localhost:8081
        VITE_GCS_BUCKET: ${GCP_BUCKET_NAME}
        VITE_GCS_PREFIX: ${GCP_PREFIX}
        VITE_SFMC_CATEGORY_ID: ${SFMC_CATEGORY_ID:-239156}
    # [CAMBIO CLAVE]: Inyectamos las variables que Nginx pide
    environment:
      - BACKEND_URL=http://backend:8080
      - NGINX_RESOLVER=127.0.0.11
    ports:
      - "8081:8080"
    depends_on:
      - backend
    restart: unless-stopped
