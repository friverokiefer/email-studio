steps:
  # ===== BACKEND =====
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/mail-studio-back:latest
      - ./backend

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - gcr.io/$PROJECT_ID/mail-studio-back:latest

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - mail-studio-back
      - --image
      - gcr.io/$PROJECT_ID/mail-studio-back:latest
      - --platform
      - managed
      - --region
      - southamerica-west1
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - 512Mi
      - --cpu
      - "1"

  # ===== FRONTEND =====
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/mail-studio-frontend:latest
      - --build-arg
      - VITE_API_BASE=$_FRONT_VITE_API_BASE
      - --build-arg
      - VITE_GCS_BUCKET=$_FRONT_VITE_GCS_BUCKET
      - --build-arg
      - VITE_GCS_PREFIX=$_FRONT_VITE_GCS_PREFIX
      - ./frontend

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - gcr.io/$PROJECT_ID/mail-studio-frontend:latest

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - run
      - deploy
      - mail-studio-frontend
      - --image
      - gcr.io/$PROJECT_ID/mail-studio-frontend:latest
      - --platform
      - managed
      - --region
      - southamerica-west1
      - --allow-unauthenticated
      - --port
      - "8080"
      - --memory
      - 1Gi
      - --cpu
      - "1"

substitutions:
  # URL REAL DE TU BACKEND EN SANTIAGO
  _FRONT_VITE_API_BASE: "https://mail-studio-back-151554496273.southamerica-west1.run.app"
  _FRONT_VITE_GCS_BUCKET: "poc-ai-martech-sandbox"
  _FRONT_VITE_GCS_PREFIX: "dev"

images:
  - "gcr.io/$PROJECT_ID/mail-studio-back:latest"
  - "gcr.io/$PROJECT_ID/mail-studio-frontend:latest"