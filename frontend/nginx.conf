server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================
    # CORRECCIÓN ERROR 413: Aumentar límite de carga
    # Permitimos hasta 20MB (tu app limita a 15MB, así que estamos sobrados)
    # =========================================================
    client_max_body_size 20M;

    # Gzip para mejorar velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. SPA: si no existe el recurso, carga la app de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy reverso para el Backend
    # CAMBIO CRÍTICO: Usamos la variable de entorno que inyectaremos en el deploy
    location /api/ {
        # Nginx reemplazará ${BACKEND_URL} al iniciar gracias al template
        proxy_pass ${BACKEND_URL};
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        
        # Evitar timeouts si la IA tarda en responder
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 3. Cache para archivos estáticos (imágenes, js, css)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}