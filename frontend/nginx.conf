server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================
    # CORRECCIÓN ERROR 413: Aumentar límite de carga
    # =========================================================
    client_max_body_size 20M;

    # Gzip para mejorar velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. SPA: si no existe el recurso, carga la app de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy reverso para el Backend
    location /api/ {
        # Resolver DNS de Google (necesario para variables en GCP)
        resolver 169.254.169.254 ipv6=off;

        # Nginx usará la URL inyectada
        proxy_pass ${BACKEND_URL};
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # --- FIX CRÍTICO CLOUD RUN ---
        # 1. Eliminamos 'proxy_set_header Host $host;' para que use el Host del backend.
        # 2. Habilitamos SNI para HTTPS.
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        
        # --- FIX BUFFER SIZE (ERROR 502) ---
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # Evitar timeouts
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 3. Cache para archivos estáticos
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}