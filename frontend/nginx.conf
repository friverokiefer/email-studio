server {
    # Cloud Run requiere que el contenedor escuche en el puerto configurado (usaremos 8080)
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================
    # CORRECCIÓN ERROR 413: Aumentar límite de carga
    # =========================================================
    client_max_body_size 20M;

    # Gzip para mejorar velocidad
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. SPA: si no existe el recurso, carga la app de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy reverso para el Backend
    # Se eliminó 'resolver ${NGINX_RESOLVER}' para evitar el error [emerg]
    location /api/ {
        # URL fija del backend desplegado en Cloud Run
        proxy_pass https://mail-studio-back-151554496273.southamerica-west1.run.app/;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Headers necesarios para identificar el origen real en la nube
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # --- SSL / CLOUD RUN ---
        # Obligatorio para conectar con servicios HTTPS (.run.app)
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        
        # --- FIX BUFFER SIZE (ERROR 502) ---
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # Evitar timeouts en generación larga de IA (5 minutos)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 3. Cache para archivos estáticos
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}