server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================================================
    # CORRECCIÓN ERROR 413: Aumentar límite de carga
    # =========================================================
    client_max_body_size 20M;

    # Gzip para mejorar velocidad de carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 1. SPA: si no existe el recurso, carga la app de React
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy reverso para el Backend
    location /api/ {
        # CRÍTICO: Resolver DNS de Google. Obligatorio cuando usas variables en proxy_pass
        resolver 169.254.169.254 ipv6=off;

        # Nginx reemplazará ${BACKEND_URL} al iniciar gracias al template del Dockerfile
        proxy_pass ${BACKEND_URL};
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # --- CONFIGURACIÓN SSL PARA CLOUD RUN ---
        # Habilita SNI para que el handshake HTTPS funcione entre servicios Cloud Run
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        # ----------------------------------------
        
        # Evitar timeouts si la IA tarda en responder (imágenes/texto largo)
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }

    # 3. Cache para archivos estáticos (imágenes, js, css)
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}